name: Build UWP Player

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET Framework 4.7.2 Developer Pack
        shell: pwsh
        run: |
          choco install netfx-4.7.2-devpack -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate UWP assets
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'UWPCloudPlayer\Assets'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mOQU9b9DwACPwFuVWu4kgAAAABJRU5ErkJggg=='
          foreach ($name in @('StoreLogo.png','Square150x150Logo.png','Square44x44Logo.png','Square71x71Logo.png')) {
            [IO.File]::WriteAllBytes((Join-Path $dir $name), [Convert]::FromBase64String($png))
          }

      - name: Setup MSBuild x64
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild .\UWPCloudPlayer\UWPCloudPlayer.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package UWP x64
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'AppPackages\'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          msbuild .\UWPCloudPlayer\UWPCloudPlayer.csproj /t:Build /p:Configuration=Debug /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false /p:AppxPackageDir="$output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $files = Get-ChildItem -Path AppPackages -Recurse -File -Include *.appx,*.msix,*.cer
          if ($files.Count -eq 0) { throw 'No AppX/MSIX package was generated.' }
          $files | Copy-Item -Destination artifacts -Force
          Compress-Archive -Path artifacts\* -DestinationPath UWPCloudPlayer-x64-v0.1.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: UWPCloudPlayer-x64-v0.1
          path: UWPCloudPlayer-x64-v0.1.zip
          if-no-files-found: error
