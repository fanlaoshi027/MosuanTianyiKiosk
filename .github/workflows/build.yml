name: Build Windows 10 UWP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate app assets
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'Assets'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $png = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mOQU9b9DwACPwFuVWu4kgAAAABJRU5ErkJggg=='
          foreach ($name in @('StoreLogo.png','Square150x150Logo.png','Square44x44Logo.png','Wide310x150Logo.png','Square310x310Logo.png')) {
            [IO.File]::WriteAllBytes((Join-Path $dir $name), [Convert]::FromBase64String($png))
          }

      - name: Setup MSBuild x64
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Verify MSBuild architecture
        shell: pwsh
        run: |
          msbuild -version
          Write-Host "MSBuild path: $((Get-Command msbuild).Source)"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild .\MosuanTianyiKiosk.csproj /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString -String 'Mosuan123!' -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=Mosuan' -KeyUsage DigitalSignature -FriendlyName 'Mosuan UWP Test Certificate' -CertStoreLocation 'Cert:\CurrentUser\My'
          $pfx = Join-Path $env:GITHUB_WORKSPACE 'MosuanTest.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $env:GITHUB_WORKSPACE 'MosuanTest.cer') | Out-Null
          "PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and package signed AppX
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE 'AppPackages\'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          msbuild .\MosuanTianyiKiosk.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=true /p:PackageCertificateKeyFile="$env:PFX" /p:PackageCertificatePassword='Mosuan123!' /p:AppxBundle=Always /p:AppxBundlePlatforms=x64 /p:AppxPackageDir="$output"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect installer files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path AppPackages -Recurse -File | Copy-Item -Destination artifacts -Force
          Copy-Item MosuanTest.cer artifacts -Force
          Compress-Archive -Path artifacts\* -DestinationPath MosuanTianyiKiosk-Windows10-x64.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MosuanTianyiKiosk-Windows10-x64
          path: MosuanTianyiKiosk-Windows10-x64.zip
          if-no-files-found: error
