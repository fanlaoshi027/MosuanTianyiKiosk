name: Clean Official Screenbox Build

on:
  push:
    branches: [screenbox-clean-libvlc3, screenbox-smart-invert-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository and official Screenbox submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\\.nuget\\packages
          key: ${{ runner.os }}-nuget-screenbox-clean-${{ hashFiles('Screenbox/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-screenbox-clean-
            ${{ runner.os }}-nuget-screenbox-

      - name: Create package signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $subject = 'CN=ABCDF790-DBE4-48F7-8204-32FCB69ADF9C'
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $subject `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -CertStoreLocation 'Cert:\\CurrentUser\\My' `
            -NotAfter (Get-Date).AddYears(2) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          if (-not $cert.HasPrivateKey) { throw 'Signing certificate has no private key.' }
          $password = [guid]::NewGuid().ToString('N') + 'Aa1!'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE 'ScreenboxDev.pfx'
          $cerPath = Join-Path $env:GITHUB_WORKSPACE 'ScreenboxDev.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation 'Cert:\\CurrentUser\\My' -Password $securePassword | Out-Null
          $reloaded = Get-PfxCertificate -FilePath $pfxPath -Password $securePassword
          if ($reloaded.Subject -ne $subject) { throw "PFX subject mismatch: $($reloaded.Subject)" }
          "PFX_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_CERTIFICATE=$pfxPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Certificate ready: Subject=$($cert.Subject); Thumbprint=$($cert.Thumbprint)"

      - name: Apply Mosuan native video picker
        shell: pwsh
        run: .\\Patches\\Apply-MosuanOpenVideosPicker.ps1

      - name: Apply Mosuan dark player theme
        shell: pwsh
        run: .\\Patches\\Apply-MosuanPlayerTheme.ps1

      - name: Apply color inversion control
        shell: pwsh
        run: .\\Patches\\Apply-MosuanColorInversion.ps1

      - name: Update package manifest for signed sideload
        shell: pwsh
        run: .\\Screenbox\\scripts\\Update-AppxManifest.ps1 -Identity Sideload

      - name: Update project version
        shell: pwsh
        run: .\\Screenbox\\scripts\\Update-ProjectVersion.ps1

      - name: Build x64 MSIX package
        shell: pwsh
        env:
          PackageDir: C:\\DeployOutput\\
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild Screenbox\\Screenbox\\Screenbox.csproj `
            -restore `
            -p:RestoreConfigFile=Screenbox\\nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageDir=$env:PackageDir `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:AppxBundlePlatforms=x64 `
            -p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Sign and verify MSIX
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Get-ChildItem 'C:\\DeployOutput' -Recurse -File -Filter '*_x64.msix' |
            Where-Object { $_.FullName -notmatch '\\\\KioskTest\\' -and $_.Name -notmatch 'language-|scale-' } |
            Select-Object -First 1
          if (-not $app) { throw 'Built x64 MSIX was not found.' }
          $signtoolPath = $null
          $signtoolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtoolCommand) { $signtoolPath = $signtoolCommand.Source }
          if (-not $signtoolPath) {
            $roots = @(
              (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\\10\\bin'),
              (Join-Path $env:ProgramFiles 'Windows Kits\\10\\bin'),
              (Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio'),
              (Join-Path $env:ProgramFiles 'Microsoft Visual Studio')
            ) | Where-Object { $_ -and (Test-Path $_) }
            foreach ($root in $roots) {
              $found = Get-ChildItem $root -Recurse -File -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool.exe$' } |
                Select-Object -First 1
              if ($found) { $signtoolPath = $found.FullName; break }
            }
          }
          if (-not $signtoolPath) { throw 'SignTool.exe was not found in PATH, Windows SDK, or Visual Studio.' }
          Write-Host "Using SignTool: $signtoolPath"
          & $signtoolPath sign /fd SHA256 /f $env:PACKAGE_CERTIFICATE /p $env:PFX_PASSWORD $app.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSIX signing failed with exit code $LASTEXITCODE" }
          # Trust the ephemeral self-signed certificate on the CI runner so chain verification can pass.
          $cerPath = Join-Path $env:GITHUB_WORKSPACE 'ScreenboxDev.cer'
          Write-Host 'Importing temporary signing certificate into CurrentUser Root and TrustedPeople stores.'
          # App Installer checks machine-level trust stores for MSIX sideloading.
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\\LocalMachine\\TrustedPeople' | Out-Null
          Write-Host 'Starting SignTool signature verification.'
          & $signtoolPath verify /pa /v $app.FullName
          if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed with exit code $LASTEXITCODE" }
          Write-Host "Verified signature for $($app.Name)"

      - name: Stage minimal x64 kiosk install files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-ChildItem 'C:\\DeployOutput' -Directory -Filter '*_Test' | Select-Object -First 1
          if (-not $source) { throw 'Test deployment directory was not generated.' }
          $stage = 'C:\\DeployOutput\\KioskTest'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          $app = Get-ChildItem 'C:\\DeployOutput' -Recurse -File -Filter '*_x64.msix' |
            Where-Object { $_.FullName -notmatch '\\\\KioskTest\\' -and $_.Name -notmatch 'language-|scale-' } |
            Select-Object -First 1
          if (-not $app) { throw 'Signed x64 MSIX was not found.' }
          Copy-Item $app.FullName $stage
          foreach ($folder in @('Dependencies\\x64','Dependencies\\Win32')) {
            $from = Join-Path $source.FullName $folder
            if (Test-Path $from) {
              $to = Join-Path $stage $folder
              New-Item -ItemType Directory -Path $to -Force | Out-Null
              Copy-Item (Join-Path $from '*') $to -Recurse -Force
            }
          }
          foreach ($file in @('Add-AppDevPackage.ps1','Install.ps1')) {
            $from = Join-Path $source.FullName $file
            if (Test-Path $from) { Copy-Item $from $stage }
          }
          $resources = Join-Path $source.FullName 'Add-AppDevPackage.resources'
          if (Test-Path $resources) {
            Copy-Item $resources (Join-Path $stage 'Add-AppDevPackage.resources') -Recurse -Force
          }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'ScreenboxDev.cer') $stage -Force
          Write-Host 'Staged verified signed x64 package:'
          Get-ChildItem $stage -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Screenbox kiosk test deployment package
        uses: actions/upload-artifact@v7
        with:
          name: Screenbox-kiosk-invert-test-x64
          path: |
            C:\\DeployOutput\\KioskTest\\
          compression-level: 6
          if-no-files-found: error
