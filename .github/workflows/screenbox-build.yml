name: Screenbox Player Build

on:
  push:
    branches:
      - screenbox-player
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-screenbox-${{ hashFiles('Screenbox/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-screenbox-

      - name: Update package manifest
        shell: pwsh
        run: .\Screenbox\scripts\Update-AppxManifest.ps1 -Identity Sideload

      - name: Update project version
        shell: pwsh
        run: .\Screenbox\scripts\Update-ProjectVersion.ps1

      - name: Build app package
        shell: pwsh
        env:
          PackageDir: C:\DeployOutput\
        run: |
          msbuild Screenbox\Screenbox\Screenbox.csproj `
            -restore `
            -p:RestoreConfigFile=Screenbox\nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageDir=$env:PackageDir `
            -p:UapAppxPackageBuildMode=SideloadOnly

      - name: Verify sideload package
        shell: pwsh
        run: |
          $testDir = Get-ChildItem -Path 'C:\DeployOutput' -Directory -Filter '*_Test' | Select-Object -First 1
          if (-not $testDir) { throw 'No *_Test sideload directory was generated.' }

          Write-Host 'Generated sideload files:'
          Get-ChildItem -Path $testDir.FullName -Recurse -File |
            Select-Object FullName, @{N='MB';E={[math]::Round($_.Length / 1MB, 1)}} |
            Format-Table -AutoSize

          $installer = Get-ChildItem -Path $testDir.FullName -Recurse -File |
            Where-Object { $_.Name -eq 'Add-AppDevPackage.ps1' } |
            Select-Object -First 1
          if (-not $installer) { throw 'Add-AppDevPackage.ps1 was not generated.' }

          Write-Host "Installer script: $($installer.FullName)"

      - name: Upload installable sideload package
        uses: actions/upload-artifact@v7
        with:
          name: screenbox-player-x64-installer
          path: |
            C:\DeployOutput\*_Test\
            !C:\DeployOutput\*_Test\*.msix
          compression-level: 0
          if-no-files-found: error
