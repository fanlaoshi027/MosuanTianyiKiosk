name: Screenbox Player Build

on:
  push:
    branches: [screenbox-player, ui-refactor-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~\.nuget\packages
          key: ${{ runner.os }}-nuget-screenbox-${{ hashFiles('Screenbox/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-screenbox-
      - name: Apply Mosuan player theme
        shell: pwsh
        run: .\Patches\Apply-MosuanPlayerTheme.ps1
      - name: Apply Mosuan UI refactor
        shell: pwsh
        run: .\Patches\Apply-MosuanUIRefactor.ps1
      - name: Apply Mosuan shell UI
        shell: pwsh
        run: .\Patches\Apply-MosuanShellUI.ps1
      - name: Apply Mosuan home layout
        shell: pwsh
        run: .\Patches\Apply-MosuanHomeLayout.ps1
      - name: Apply Mosuan queue layout
        shell: pwsh
        run: .\Patches\Apply-MosuanQueueLayout.ps1
      - name: Apply Mosuan playlist layout
        shell: pwsh
        run: .\Patches\Apply-MosuanPlaylistLayout.ps1
      - name: Apply Mosuan folder playlist service
        shell: pwsh
        run: .\Patches\Apply-MosuanFolderPlaylist.ps1
      - name: Apply Mosuan folder playlist page
        shell: pwsh
        run: .\Patches\Apply-MosuanFolderPlaylistUI.ps1
      - name: Apply Mosuan visual polish
        shell: pwsh
        run: .\Patches\Apply-MosuanVisualPolish.ps1
      - name: Apply Mosuan control bar polish
        shell: pwsh
        run: .\Patches\Apply-MosuanControlBarPolish.ps1
      - name: Apply Mosuan video tools
        shell: pwsh
        run: .\Patches\Apply-MosuanVideoTools.ps1
      - name: Apply Mosuan crop and mask features
        shell: pwsh
        run: .\Patches\Apply-MosuanPlayerFeatures.ps1
      - name: Apply Mosuan normalized layout rules
        shell: pwsh
        run: .\Patches\Apply-MosuanLayoutRules.ps1
      - name: Apply x64-only package size profile
        shell: pwsh
        run: .\Patches\Apply-MosuanPackageSize.ps1
      - name: Update package manifest
        shell: pwsh
        run: .\Screenbox\scripts\Update-AppxManifest.ps1 -Identity Sideload
      - name: Update project version
        shell: pwsh
        run: .\Screenbox\scripts\Update-ProjectVersion.ps1
      - name: Build app package
        shell: pwsh
        env:
          PackageDir: C:\DeployOutput\
        run: |
          msbuild Screenbox\Screenbox\Screenbox.csproj `
            -restore `
            -p:RestoreConfigFile=Screenbox\nuget.config `
            -p:ContinuousIntegrationBuild=true `
            -p:Configuration=Release `
            -p:Platform=x64 `
            -p:AppxPackageDir=$env:PackageDir `
            -p:UapAppxPackageBuildMode=SideloadOnly
      - name: Sign MSIX and package publisher certificate
        shell: pwsh
        env:
          PackageDir: C:\DeployOutput\
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -Path $env:PackageDir -Recurse -Filter '*.msix' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one MSIX package, found $($packages.Count)." }
          $msix = $packages[0]

          $publisher = 'CN=ABCDF790-DBE4-48F7-8204-32FCB69ADF9C'
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $publisher `
            -FriendlyName 'Mosuan Player Sideload Signing' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
            -NotAfter (Get-Date).AddYears(5)

          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem -Path $sdkRoot -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK SignTool.exe was not found.' }

          & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed: $LASTEXITCODE" }

          $certificatePath = Join-Path $msix.DirectoryName 'MosuanPlayerSigning.cer'
          Export-Certificate -Cert $cert -FilePath $certificatePath -Type CERT | Out-Null

          Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

          & $signtool verify /pa /v $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed: $LASTEXITCODE" }

          $installerPath = Join-Path $msix.DirectoryName 'Install-MosuanPlayer.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          $root = $PSScriptRoot
          $certificate = Join-Path $root 'MosuanPlayerSigning.cer'
          $installer = Join-Path $root 'Install.ps1'
          if (-not (Test-Path $certificate)) { throw "Publisher certificate not found: $certificate" }
          if (-not (Test-Path $installer)) { throw "App package installer not found: $installer" }
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'Please right-click Install-MosuanPlayer.ps1 and choose Run with PowerShell as Administrator.'
          }
          Import-Certificate -FilePath $certificate -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath $certificate -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          & $installer
          if ($LASTEXITCODE -ne 0) { throw "App installer returned exit code $LASTEXITCODE" }
          '@ | Set-Content -Path $installerPath -Encoding UTF8

          Write-Host "Signed package: $($msix.Name)"
          Write-Host "Publisher certificate: $certificatePath"

      - name: Upload sideload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MosuanPlayer-x64-core
          path: |
            C:\DeployOutput\*_Test\
            !C:\DeployOutput\*_Test\*.appxsym
            !C:\DeployOutput\*_Test\Dependencies\arm\
            !C:\DeployOutput\*_Test\Dependencies\arm64\
            !C:\DeployOutput\*_Test\Dependencies\x86\
            !C:\DeployOutput\*_Test\Dependencies\Win32\
          compression-level: 9
          if-no-files-found: error
