name: Screenbox Player Build

on:
  push:
    branches:
      - screenbox-player
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore
        shell: pwsh
        run: |
          nuget restore Screenbox/Screenbox.slnx -NonInteractive

      - name: Build x64 package
        shell: pwsh
        run: |
          msbuild Screenbox/Screenbox.slnx /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:UapAppxPackageBuildMode=CI /p:AppxBundle=Never /p:AppxBundlePlatforms=x64 /p:GenerateAppxPackageOnBuild=true /p:GenerateTestArtifacts=false /p:AppxPackageSigningEnabled=false /m

      - name: Remove duplicate build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path Screenbox -Directory -Recurse -Filter bin | ForEach-Object {
            Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch 'x64\\Release' } | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Show package sizes
        shell: pwsh
        run: |
          Get-ChildItem -Path Screenbox -Recurse -File -Include *.msix,*.msixbundle,*.appxbundle -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending |
            Select-Object -First 20 FullName,@{N='MB';E={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Upload x64 package only
        uses: actions/upload-artifact@v4
        with:
          name: screenbox-player-x64-slim
          path: |
            Screenbox/**/AppPackages/**/*.msix
            Screenbox/**/AppPackages/**/*.msixbundle
            Screenbox/**/AppPackages/**/*.appxbundle
          if-no-files-found: error
