name: LibVLC 4 UWP Probe

on:
  push:
    branches: [libvlc4-uwp-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Create probe project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Set-Location probe
          dotnet new console -n LibVLC4Probe -f net8.0

      - name: Install LibVLC 4 binding and native runtime
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          dotnet add package LibVLC4Sharp.Core --prerelease --source https://api.nuget.org/v3/index.json
          dotnet add package Endpne.LibVLC.Windows --version 4.0.2-dev --source https://api.nuget.org/v3/index.json
          dotnet add package Vortice.Direct3D11 --version 3.8.3 --source https://api.nuget.org/v3/index.json
          dotnet list package

      - name: Compile LibVLC 4 API probe
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          @'
          using System;
          using LibVLCSharp.Core;

          LibVLC.Initialize();
          Console.WriteLine("LibVLC version: " + LibVLC.Version);
          using var vlc = new LibVLC("--no-video");
          using var player = vlc.CreateMediaPlayer();
          Console.WriteLine("MediaPlayer created: " + player.GetType().FullName);
          '@ | Set-Content -Encoding UTF8 Program.cs
          dotnet build --configuration Release --no-restore

      - name: Compile D3D11 output callback bridge probe
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          @'
          using System;
          using LibVLCSharp.Core;
          using LibVLCSharp.Core.Interop;
          using Vortice.DXGI;
          using Vortice.Direct3D11;
          using Vortice.DXGI;
          using Vortice.Direct3D11;

          unsafe class Program
          {
              static bool Setup(IntPtr* opaque, libvlc_video_setup_device_cfg_t* cfg, libvlc_video_setup_device_info_t* output)
              {
                  output->u.d3d11.device_context = IntPtr.Zero;
                  output->u.d3d11.context_mutex = IntPtr.Zero;
                  return false;
              }

              static void Cleanup(IntPtr opaque) { }

              static void SetWindow(IntPtr opaque, IntPtr resize, IntPtr mouseMove, IntPtr mousePress, IntPtr mouseRelease, IntPtr reportOpaque) { }

              static bool UpdateOutput(IntPtr opaque, libvlc_video_render_cfg_t* cfg, libvlc_video_output_cfg_t* output)
              {
                  output->u.dxgi_format = 87;
                  return true;
              }

              static void Swap(IntPtr opaque) { }

              static bool MakeCurrent(IntPtr opaque, bool enter) => true;

              static bool SelectPlane(IntPtr opaque, UIntPtr plane, IntPtr output)
              {
                  if (output == IntPtr.Zero) return false;
                  *(IntPtr*)output = IntPtr.Zero;
                  return false;
              }

              static void Main()
              {
                  LibVLC.Initialize();
                  using var vlc = new LibVLC("--no-video");
                  using var player = vlc.CreateMediaPlayer();

                  VideoOutputSetupCallback setup = Setup;
                  VideoOutputCleanupCallback cleanup = Cleanup;
                  VideoOutputSetWindowCallback window = SetWindow;
                  VideoUpdateOutputCallback update = UpdateOutput;
                  VideoSwapCallback swap = Swap;
                  VideoMakeCurrentCallback current = MakeCurrent;
                  VideoOutputSelectPlaneCallback select = SelectPlane;

                  Console.WriteLine("D3D11 callback bridge signatures compiled.");
                  Console.WriteLine("SetOutputCallbacks result: " +
                      player.SetOutputCallbacks(VideoEngine.D3d11, setup, cleanup, window, update, swap, current,
                          null, null, select));
              }
          }
          '@ | Set-Content -Encoding UTF8 Program.cs
          $csproj = Get-Content LibVLC4Probe.csproj -Raw
          $csproj = $csproj -replace '</Project>', '  <PropertyGroup><AllowUnsafeBlocks>true</AllowUnsafeBlocks></PropertyGroup></Project>'
          Set-Content LibVLC4Probe.csproj -Value $csproj -Encoding UTF8
          dotnet build --configuration Release

      - name: Compile D3D11 output bridge skeleton
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          New-Item -ItemType Directory -Force D3D11 | Out-Null
          @'
          using System;
          using LibVLCSharp.Core;
          using LibVLCSharp.Core.Interop;
          using Vortice.DXGI;
          using Vortice.Direct3D11;

          namespace LibVLC4Probe.D3D11;

          public unsafe sealed class D3D11OutputBridge : IDisposable
          {
              private readonly VideoOutputSetupCallback _setup;
              private readonly VideoOutputCleanupCallback _cleanup;
              private readonly VideoOutputSetWindowCallback _window;
              private readonly VideoUpdateOutputCallback _update;
              private readonly VideoSwapCallback _swap;
              private readonly VideoMakeCurrentCallback _current;
              private readonly VideoOutputSelectPlaneCallback _select;

              private ID3D11Device? _device;
              private ID3D11DeviceContext? _deviceContext;
              private ID3D11Texture2D? _texture;
              private ID3D11RenderTargetView? _renderTargetView;

              public D3D11OutputBridge()
              {
                  _setup = Setup;
                  _cleanup = Cleanup;
                  _window = SetWindow;
                  _update = UpdateOutput;
                  _swap = Swap;
                  _current = MakeCurrent;
                  _select = SelectPlane;
              }

              public bool Attach(MediaPlayer player)
              {
                  return player.SetOutputCallbacks(
                      VideoEngine.D3d11,
                      _setup, _cleanup, _window, _update, _swap, _current,
                      null, null, _select);
              }

              public void SetDevice(ID3D11Device device, ID3D11DeviceContext context)
              {
                  _device = device;
                  _deviceContext = context;
              }

              private bool Setup(IntPtr* opaque, libvlc_video_setup_device_cfg_t* cfg, libvlc_video_setup_device_info_t* output)
              {
                  if (_deviceContext == IntPtr.Zero) return false;
                  output->u.d3d11.device_context = _deviceContext.NativePointer;
                  output->u.d3d11.context_mutex = IntPtr.Zero;
                  return true;
              }

              private void Cleanup(IntPtr opaque)
              {
                  _renderTargetView?.Dispose();
                  _renderTargetView = null;
                  _texture?.Dispose();
                  _texture = null;
              }

              private void SetWindow(IntPtr opaque, IntPtr resize, IntPtr mouseMove, IntPtr mousePress, IntPtr mouseRelease, IntPtr reportOpaque) { }

              private bool UpdateOutput(IntPtr opaque, libvlc_video_render_cfg_t* cfg, libvlc_video_output_cfg_t* output)
              {
                  if (cfg->width == 0 || cfg->height == 0) return false;
                  _renderTargetView?.Dispose();
                  _renderTargetView = null;
                  _texture?.Dispose();
                  _texture = null;

                  _texture = _device!.CreateTexture2D(new Texture2DDescription
                  {
                      Width = cfg->width,
                      Height = cfg->height,
                      MipLevels = 1,
                      ArraySize = 1,
                      Format = Format.B8G8R8A8_UNorm,
                      SampleDescription = new SampleDescription(1, 0),
                      Usage = ResourceUsage.Default,
                      BindFlags = BindFlags.RenderTarget | BindFlags.ShaderResource,
                      CPUAccessFlags = CpuAccessFlags.None,
                      MiscFlags = ResourceOptionFlags.Shared
                  });
                  _renderTargetView = _device.CreateRenderTargetView(_texture);
                  output->u.dxgi_format = 87;
                  return true;
              }

              private void Swap(IntPtr opaque) { }

              private bool MakeCurrent(IntPtr opaque, bool enter) => true;

              private bool SelectPlane(IntPtr opaque, UIntPtr plane, IntPtr output)
              {
                  if (output == IntPtr.Zero || _renderTargetView is null) return false;
                  *(IntPtr*)output = _renderTargetView.NativePointer;
                  return true;
              }

              public void Dispose()
              {
                  _renderTargetView?.Dispose();
                  _renderTargetView = null;
                  _texture?.Dispose();
                  _texture = null;
              }
          }
          '@ | Set-Content -Encoding UTF8 D3D11/D3D11OutputBridge.cs
          $csproj = Get-Content LibVLC4Probe.csproj -Raw
          $csproj = $csproj -replace '</Project>', '  <PropertyGroup><AllowUnsafeBlocks>true</AllowUnsafeBlocks></PropertyGroup></Project>'
          Set-Content LibVLC4Probe.csproj -Value $csproj -Encoding UTF8
          dotnet build --configuration Release

      - name: Run LibVLC 4 D3D11 bridge probe
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          @'
          using System;
          using LibVLCSharp.Core;
          using LibVLC4Probe.D3D11;
          using Vortice.Direct3D;
          using Vortice.Direct3D11;

          LibVLC.Initialize();
          using var vlc = new LibVLC("--no-video");
          using var player = vlc.CreateMediaPlayer();

          D3D11.D3D11CreateDevice(null, DriverType.Hardware, DeviceCreationFlags.BgraSupport, Array.Empty<Vortice.Direct3D.FeatureLevel>(), out ID3D11Device device, out ID3D11DeviceContext context).CheckError();
          using (device)
          using (context)
          using (var bridge = new D3D11OutputBridge())
          {
              bridge.SetDevice(device, context);
              Console.WriteLine("D3D11 context: 0x" + context.NativePointer.ToString("x"));
              Console.WriteLine("Attach result: " + bridge.Attach(player));
          }
          '@ | Set-Content -Encoding UTF8 Program.cs
          $csproj = Get-Content LibVLC4Probe.csproj -Raw
          $csproj = $csproj -replace '</Project>', '  <PropertyGroup><AllowUnsafeBlocks>true</AllowUnsafeBlocks></PropertyGroup></Project>'
          Set-Content LibVLC4Probe.csproj -Value $csproj -Encoding UTF8
          dotnet run --configuration Release
