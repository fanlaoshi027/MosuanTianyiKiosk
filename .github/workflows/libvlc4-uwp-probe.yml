name: LibVLC 4 UWP Probe

on:
  push:
    branches: [libvlc4-uwp-probe]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Create probe project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe | Out-Null
          Set-Location probe
          dotnet new classlib -n LibVLC4Probe -f net8.0

      - name: Probe LibVLC 4 core binding
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          dotnet add package LibVLC4Sharp.Core --prerelease --source https://api.nuget.org/v3/index.json
          dotnet list package

      - name: Compile LibVLC 4 API probe
        shell: pwsh
        run: |
          Set-Location probe/LibVLC4Probe
          @'
          using System;
          using LibVLCSharp.Core;

          internal static class Program
          {
              public static void Probe()
              {
                  LibVLC.Initialize();
                  Console.WriteLine(LibVLC.Version);
                  using var vlc = new LibVLC();
                  using var player = vlc.CreateMediaPlayer();
                  Console.WriteLine(player.GetType().FullName);
              }
          }
          '@ | Set-Content -Encoding UTF8 Probe.cs
          dotnet build --configuration Release --no-restore

      - name: Report
        shell: pwsh
        run: |
          Write-Host 'LibVLC 4 core binding probe completed.'
          Write-Host 'Next step: connect the D3D11 output callback layer to Screenbox.VideoView.'
