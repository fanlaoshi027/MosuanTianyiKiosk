name: Build Tianyi Kiosk UWP

on:
  push:
    branches: [ tianyi-uwp-clean ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild x64
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build UWP x64
        shell: pwsh
        run: |
          msbuild .\TianyiKioskUWP\TianyiKioskUWP.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /v:minimal

      - name: Package UWP x64
        shell: pwsh
        run: |
          msbuild .\TianyiKioskUWP\TianyiKioskUWP.csproj /t:Build /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\" /v:minimal

      - name: Upload AppX
        uses: actions/upload-artifact@v4
        with:
          name: TianyiKioskUWP-x64
          path: artifacts/**/*.appx
          if-no-files-found: error
